# fly.toml app configuration file generated for confidential-rwa-api on 2026-10-26T03:03:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'confidential-rwa-api'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  REPO_ROOT = '/app'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'get'
    path = '/health'

[[restart]]
  policy = 'always'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2048'
